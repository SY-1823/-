<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>仓储管理系统</title>
<style>
body{margin:0;background:#1a1a2e;font-family:'Microsoft YaHei',sans-serif;}
#pwdBox{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#pwdBox>div{background:#16213e;padding:40px;border-radius:12px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
h2{color:#e0e0e0;margin:0 0 8px 0;}p{color:#8892b0;margin:0 0 24px 0;font-size:14px;}
input{width:240px;padding:10px 14px;border:1px solid #3a3f5c;border-radius:6px;background:#0f3460;color:#e0e0e0;font-size:15px;outline:none;text-align:center;}
button{display:block;width:240px;margin:16px auto 0;padding:10px;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
#err{color:#e94560;margin:12px 0 0 0;font-size:13px;display:none;}
</style></head>
<body>
<div id="pwdBox"><div>
<h2>仓储管理系统</h2><p>请输入访问密码</p>
<input id="pi" type="password" placeholder="输入密码">
<button onclick="c()">进入系统</button>
<p id="err">密码错误</p>
</div></div>
<script>
function c(){if(document.getElementById('pi').value==='hechen888'){document.getElementById('pwdBox').style.display='none';sessionStorage.setItem('_auth','1');location.href='仓储管理系统/inventory.html';}else{document.getElementById('err').style.display='block';document.getElementById('pi').value='';}}
if(sessionStorage.getItem('_auth')==='1')location.href='仓储管理系统/inventory.html';
document.getElementById('pi').onkeydown=function(e){if(e.key==='Enter')c();};
</script>
</body></html>
